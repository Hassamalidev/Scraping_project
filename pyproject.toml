[project]
name = "tradebook"
version = "0.1.0"
description = "Tradebook — Pro Data Engine: a verified, compliance-aware database of local trade businesses."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "geoalchemy2>=0.15",
    "httpx>=0.27",
    "jinja2>=3.1",
    "phonenumbers>=8.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.30,<2.1",
    "structlog>=24.1",
    "tenacity>=8.3",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
prodata = "prodata.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prodata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
