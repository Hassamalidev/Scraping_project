services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: prodata
      POSTGRES_PASSWORD: prodata
      POSTGRES_DB: prodata
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prodata -d prodata"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
