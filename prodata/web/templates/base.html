<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tradebook{% endblock %} · {{ brand }}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">{{ brand[:1] }}</span>
      <span>
        <span class="brand-name">{{ brand }}</span>
        <span class="brand-sub">{{ market.metros[0].name }}, {{ market.state }}</span>
      </span>
    </a>
    <nav class="mainnav" aria-label="Main">
      <a href="/" class="{{ 'active' if nav == 'home' }}">Home</a>
      <a href="/workers" class="{{ 'active' if nav == 'workers' }}">Find workers</a>
      <a href="/clients" class="{{ 'active' if nav == 'clients' }}">Find clients{% if new_clients_badge %}<span class="count">{{ new_clients_badge }}</span>{% endif %}</a>
      <a href="/deals" class="{{ 'active' if nav == 'deals' }}">Deals</a>
    </nav>
    <nav class="subnav" aria-label="Settings">
      <a href="/sources" class="{{ 'active' if nav == 'sources' }}">Data sources</a>
      <a href="/compliance" class="{{ 'active' if nav == 'compliance' }}">Do-not-call list</a>
    </nav>
  </div>
</header>
<main class="page">
  {% block content %}{% endblock %}
</main>
</body>
</html>
